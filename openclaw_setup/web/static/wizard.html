<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set up OpenClaw</title>
    <link rel="stylesheet" href="/static/wizard.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo">🐾</span>
          <span class="brand-text">clawup</span>
        </div>
        <div class="step-counter" id="step-counter"></div>
      </header>

      <main class="stage" id="stage"></main>

      <footer class="footer">
        <span class="muted">Everything runs on your machine. Nothing is stored online.</span>
      </footer>
    </div>

    <!-- ============================================================ -->
    <!-- Screen templates                                              -->
    <!-- ============================================================ -->

    <!-- Step 1 of 3 -->
    <template id="tpl-profile">
      <section class="screen">
        <h2>Where do you want to use your AI?</h2>
        <p class="lede">Pick one. You can always add more later.</p>
        <div class="cards" id="profile-cards"></div>
        <button class="advanced-toggle" id="advanced-toggle">Show advanced options ↓</button>
      </section>
    </template>

    <!-- Step 2 of 3 -->
    <template id="tpl-provider">
      <section class="screen">
        <h2>Which AI service do you have?</h2>
        <p class="lede">Pick the one you signed up for. Don't have one yet? OpenAI is the easiest to start with.</p>
        <div class="cards" id="provider-cards"></div>
        <div class="actions">
          <button class="btn ghost" data-action="back">← Back</button>
        </div>
      </section>
    </template>

    <!-- Step 3 of 3 -->
    <template id="tpl-install">
      <section class="screen">
        <div class="install-header">
          <h2>Setting everything up…</h2>
          <p class="install-status" id="install-status">This usually takes a minute or two. Hang tight.</p>
        </div>
        <ol class="steps" id="install-steps"></ol>
        <details class="log-details">
          <summary>Show technical log</summary>
          <pre class="log" id="install-log"></pre>
        </details>
      </section>
    </template>

    <!-- Done -->
    <template id="tpl-done">
      <section class="screen">
        <div class="done-badge" id="done-badge">✓</div>
        <h1 id="done-title">You're all set!</h1>
        <p class="lede" id="done-lede">Your AI is installed and ready to use.</p>
        <div class="done-first-step" id="done-first-step"></div>
        <div class="check-list" id="check-list"></div>
        <div class="actions">
          <button class="btn primary big" id="finish-btn" data-action="finish">Close setup</button>
        </div>
      </section>
    </template>

    <!-- Failed -->
    <template id="tpl-failed">
      <section class="screen">
        <div class="done-badge failed">!</div>
        <h1>Something went wrong.</h1>
        <p class="lede" id="failed-reason"></p>
        <p class="failed-hint">Open a terminal and run <code>openclaw doctor</code> for more help.</p>
        <div class="actions">
          <button class="btn primary" data-action="restart">Try again</button>
        </div>
      </section>
    </template>

    <script src="/static/wizard.js"></script>
  </body>
</html>
